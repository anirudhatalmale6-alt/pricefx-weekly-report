; Copy to pricefx_config.ini and fill in. That file is the only place your
; password lives - keep it on your machine and do not email it to anybody,
; including me.
[pricefx]
base_url = your-instance.pricefx.eu
partition = your-partition
account = your-username
password =

; A vendor is called out when its summed SKU Impact is this far from zero,
; either direction.
vendor_threshold = 100000

; Where the weekly file is written.
output_folder = C:\Automation\Output

; Optional. Where the MONTHLY file is written, if you want it kept apart from
; the weekly one. Delete this line and both land in output_folder.
monthly_output_folder = C:\Automation\Output Monthly

; Which product attribute holds the 1st level hierarchy. Run
;     pricefx_weekly.py --find-hierarchy
; once and paste the answer here. Without it, a price list that covers several
; categories gets filed under one instead of being split across them.
hierarchy_field =

; Which workflow statuses count towards the week. Comma separated, spelling and
; case do not matter. NO_APPROVAL_REQUIRED means the list went live without
; needing a sign-off, so it counts the same as an approved one.
; Anything submitted in the week but NOT in this list is named, with its status,
; in price_lists_left_out.txt next to the report - so if one of them should be
; counted, copy its status in here.
workflow_statuses = APPROVED, NO_APPROVAL_REQUIRED
