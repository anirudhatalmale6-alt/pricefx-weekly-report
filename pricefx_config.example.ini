; Copy to pricefx_config.ini beside the script and fill in.
; This file is the only place your password lives - keep it local.
[pricefx]
base_url = yourcompany.pricefx.eu
partition = your-partition
account = your-username
password =

; A vendor is flagged when its summed SKU Impact is this far from zero.
vendor_threshold = 100000

; Where the weekly CSV is written.
output_folder = C:\Automation\Output
